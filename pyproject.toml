[project]
name = "agent-stuff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "interrogate>=1.7.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errors, pyflakes, isort, bugbear, pyupgrade

[tool.interrogate]
fail-under = 80
ignore-init-module = true
ignore-magic = true
verbose = 1

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]